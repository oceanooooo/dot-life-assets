<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜덤 뽑기 — 도트 라이프</title><link rel="stylesheet" href="widget.css">
<style>textarea{width:100%;height:64px;resize:none;border:2px dashed var(--l);border-radius:6px;font:13px/1.5 "Galmuri";padding:4px 8px;background:var(--w);color:var(--k);outline:none}
.res{display:flex;align-items:center;gap:10px;font:20px "GalmuriB";min-height:48px}.res img{width:44px;height:44px}</style>
</head><body><div class="panel"><div class="title"><img src="../icons/sparkle.png" alt=""><span id="tt">오늘 뭐 볼까?</span></div>
<textarea id="t" placeholder="한 줄에 하나씩 후보를 적어요"></textarea>
<div class="res"><img src="../anim/sora_cheer.gif" alt=""><span id="r">두근두근…</span></div>
<div class="row"><button class="btn on" id="go">🎲 뽑기</button><span class="sub" id="c"></span></div></div>
<script>
/* ?t=제목&id=저장이름  후보 목록은 이 기기에 저장 */
const q=new URLSearchParams(location.search),key="dl-pick-"+(q.get("id")||"main");tt.textContent=q.get("t")||"오늘 뭐 볼까?";
try{t.value=localStorage.getItem(key)||"보던 드라마 다음 화\n찜해 둔 영화\n웹툰 몰아보기\n책 30쪽"}catch(e){}
const items=()=>t.value.split("\n").map(s=>s.trim()).filter(Boolean);
t.oninput=()=>{try{localStorage.setItem(key,t.value)}catch(e){}c.textContent=items().length+"개 후보"};t.oninput();
go.onclick=()=>{const it=items();if(!it.length)return;let k=0;const sp=setInterval(()=>{r.textContent=it[Math.floor(Math.random()*it.length)];if(++k>12){clearInterval(sp);r.textContent="▶ "+it[Math.floor(Math.random()*it.length)]}},70)};
</script></body></html>
