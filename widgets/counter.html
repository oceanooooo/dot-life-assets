<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>글자수 세기 — 도트 라이프</title><link rel="stylesheet" href="widget.css">
<style>textarea{flex:1;width:100%;resize:none;border:2px dashed var(--l);border-radius:6px;background:var(--w);font:14px/1.6 "Galmuri";padding:6px 8px;outline:none;color:var(--k)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.st div{border:2px solid var(--k);border-radius:6px;background:var(--c);text-align:center;padding:4px;font-size:11px}.st b{display:block;font:16px "GalmuriB"}</style>
</head><body><div class="panel"><div class="title"><img src="../icons/manuscript.png" alt="">글자수 세기<span class="sub" style="margin-left:auto" id="g"></span></div>
<textarea id="t" placeholder="원고를 붙여 넣으면 바로 세어요"></textarea>
<div class="st"><div>공백 포함<b id="a">0</b></div><div>공백 제외<b id="b">0</b></div><div>원고지(200자)<b id="c">0</b></div><div>문단<b id="d">0</b></div></div>
<div class="bar" id="br"></div></div>
<script>
const goal=+new URLSearchParams(location.search).get("goal")||5000;
function up(){const v=t.value,all=[...v.replace(/\r?\n/g,"")].length,ns=[...v.replace(/\s/g,"")].length;
 a.textContent=all.toLocaleString();b.textContent=ns.toLocaleString();c.textContent=Math.ceil([...v].length/200);d.textContent=v.trim()?v.trim().split(/\n\s*\n|\n/).filter(x=>x.trim()).length:0;
 const r=Math.min(all/goal,1);br.innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<Math.round(r*20)?"f":""}" style="${r>=1&&i<20?"background:var(--G)":""}"></i>`).join("");
 g.textContent=`목표 ${goal.toLocaleString()}자 · ${Math.floor(r*100)}%`}
t.oninput=up;up();
</script></body></html>
